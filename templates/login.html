<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102033">
  <link rel="icon" href="{{ url_for('static', filename='assets/smartbill-favicon.png', v='20261028-new-logo') }}" type="image/png">
  <title>Sign in — SmartBill</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app-redesign.css') }}?v=20261028-logo-variants">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="{{ url_for('static', filename='assets/smartbill-logo-light-bg.png', v='20261028-new-logo') }}" alt="SmartBill" class="auth-logo">
    <div class="auth-intro">
      <p class="eyebrow">Secure workspace</p>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage your shop with confidence.</p>
    </div>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="auth-field">
        <label for="email">Email address</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <div class="auth-label-row"><label for="password">Password</label><button type="button" class="auth-toggle-password" data-password-toggle="password">Show</button></div>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block-custom auth-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-footer">New shop? <a href="{{ url_for('register') }}">Create an account <span aria-hidden="true">→</span></a></p>
  </main>
  <script>
    document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
      button.addEventListener('click', function () {
        var input = document.getElementById(button.getAttribute('data-password-toggle'));
        var visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        button.textContent = visible ? 'Show' : 'Hide';
      });
    });
  </script>
</body>
</html>
